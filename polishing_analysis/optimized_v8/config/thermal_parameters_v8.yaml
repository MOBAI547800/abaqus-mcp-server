# V8 Thermal Parameters
# Generated: 2026-07-23
# Source: V8 prompt §29

thermal_input:
  source: "Area-weighted CPRESS from frame-driven contact ODB"
  forbidden_input: "RawMax CPRESS — must use area-weighted pressure"

heat_generation:
  type: "Frictional heating with heat partition"
  q_friction: "mu * p * v_rel"
  q_workpiece: "eta * q_friction"
  heat_partition_to_workpiece: 0.50

relative_velocity:
  v_belt: "From x1 RPM and big pulley diameter"
  v_workpiece_surface: 5.0  # mm/s
  v_rel: "|v_belt_vector - v_workpiece_vector|"

trajectory:
  theta_workpiece_t: "theta0 - 0.384615 * t"
  x_axial_t: "triangular_wave(0, 80, x3_mms, 20 cycles)"
  stage_distance_mm: 3200.0
  rough_stage_time_s: "3200 / x3_mms"
  fine_stage_time_s: "3200 / x3_mms"
  total_time_s: "6400 / x3_mms"

thermal_boundary:
  ambient_temperature_C: 20.0
  convection_W_per_m2K: 20.0
  emissivity: 0.30
  contact_conductance_W_per_m2K: 5000.0

dflux_subroutine:
  path: "subroutines/dflux_polishing_v8.for"
  compiler: "gfortran"
  requirements:
    - "Pressure kernel must integrate to ODB normal force"
    - "Heat flux integral must recover friction power"
    - "Smooth pressure kernel — report smoothing error"

thermal_validation:
  max_temperature_C: 1400.0
  warning_range_C: [800, 1400]
  tmax_exceeds_1400: "INVALID_THERMAL_RANGE"
  tmax_800_to_1400: "MATERIAL_DATA_OUT_OF_RANGE"
  energy_balance_error_target_pct: 5.0
  energy_balance_error_max_pct: 10.0

  forbidden:
    - "Temperature truncation"
    - "Reference to 5803.6°C"
    - "RawMax CPRESS as heat input"

sensitivity:
  mesh: "Coarse/medium/fine thermal mesh"
  timestep: "Half and double nominal time step"
  heat_source_radius: "Nominal ± 50% pressure kernel width"
